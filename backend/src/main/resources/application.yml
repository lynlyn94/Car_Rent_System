server:
  port: 8081

spring:
  application:
    name: car-rent-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/car_rent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_mysql_password}
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.carrent.mapper: info

jwt:
  # 生产环境请更换为随机密钥（长度需 >= 32 字节）
  secret: ${JWT_SECRET:car-rent-system-jwt-secret-key-please-change-in-production-2026}
  # Token 有效期（毫秒），默认 24 小时
  expiration: 86400000

file:
  # 图片上传目录（相对当前工作目录；IDEA 运行时通常为 backend/ 目录）
  upload-dir: ${user.dir}/uploads
